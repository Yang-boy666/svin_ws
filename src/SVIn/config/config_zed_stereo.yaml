%YAML:1.0

# Config file for ZED stereo camera + built-in IMU
# Calibrated with kalibr (2026-03-18)
# Camera model: pinhole + radtan distortion
# Resolution: 960x540

cameras:
    # Left camera (cam0)
    - {T_SC:
       [ 0.01216599, -0.01404103,  0.9998274,   0.08666391,
        -0.9998429,   0.01271965,  0.0123448,  -0.0988754,
        -0.01289079, -0.99982051, -0.01388407,  0.05677517,
          0.0, 0.0, 0.0, 1.0],
       image_dimension: [960, 540],
       distortion_coefficients: [-0.077404466277624, 0.040551337333836146, 0.0005165250520759718, 0.0013548665795142423],
       distortion_type: radialtangential,
       focal_length: [531.5854839119636, 531.9418899745004],
       principal_point: [477.43031320611044, 275.00638542423246]}

    # Right camera (cam1)
    - {T_SC:
       [ 0.01865616, -0.02217928,  0.99957993,  0.08822507,
        -0.99978704,  0.00840747,  0.01884658, -0.21820348,
        -0.00882194, -0.99971866, -0.02201771,  0.05536671,
          0.0, 0.0, 0.0, 1.0],
       image_dimension: [960, 540],
       distortion_coefficients: [-0.07489648165922076, 0.04147470852691014, -0.00010289937864839974, 7.1187513835112e-05],
       distortion_type: radialtangential,
       focal_length: [530.6744751405682, 531.1048065844222],
       principal_point: [480.20493000506843, 267.86147668501604]}

camera_params:
    camera_rate: 20
    sigma_absolute_translation: 0.0
    sigma_absolute_orientation: 0.0
    sigma_c_relative_translation: 0.0
    sigma_c_relative_orientation: 0.0

imu_params:
    a_max: 176.0
    g_max: 7.8
    sigma_g_c: 0.00017630374332390088  # gyro noise density [rad/s/sqrt(Hz)]
    sigma_a_c: 0.0012943427263198248    # accelerometer noise density [m/s^2/sqrt(Hz)]
    sigma_bg: 0.03
    sigma_ba: 0.1
    sigma_gw_c: 4.8453452642470325e-05  # gyro drift noise density [rad/s^s/sqrt(Hz)]
    sigma_aw_c: 0.00015022616332559084  # accelerometer drift noise density [m/s^2/sqrt(Hz)]
    tau: 3600.0
    g: 9.807  # from kalibr calibration gravity vector magnitude
    a0: [ 0.0, 0.0, 0.0 ]
    imu_rate: 100
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0,
         0.0000, 1.0000, 0.0000, 0.0,
         0.0000, 0.0000, 1.0000, 0.0,
         0.0000, 0.0000, 0.0000, 1.0000]

# Estimator parameters
numKeyframes: 5
numImuFrames: 3

# ceres optimization options
ceres_options:
    minIterations: 3
    maxIterations: 10
    timeLimit: 0.035

# detection
detection_options:
    threshold: 30.0
    octaves: 1
    maxNoKeypoints: 400

# delay of images [s]:
imageDelay: 0.0

# display debug images?
displayImages: true
publishDebugImages: false

# use direct driver
useDriver: false

# publishing options
publishing_options:
    publish_rate: 100
    publishLandmarks: true
    landmarkQualityThreshold: 1.0e-2
    maximumLandmarkQuality: 0.05
    maxPathLength: 20
    publishImuPropagatedState: false
    T_Wc_W:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]
    trackedBodyFrame: B
    velocitiesFrame: Wc

isSonarUsed: false
isDepthUsed: false
histogramMethod: "NONE"  # NONE, HISTOGRAM, CLAHE
resizeFactor: 0.5

loop_closure_params:
    enable: 1
    min_correspondences: 20
    pnp_reprojection_threshold: 25.0
    pnp_ransac_iterations: 100
    keyframe_queue: 10
    max_yaw_diff: 30.0
    max_position_diff: 6.0

health:
    enable: 0
    min_keypoints: 15
    consecutive_keyframes: 3
    keyframe_wait_time: 2.0
    kps_per_quadrant: 1

global_map_params:
    enable: 1
    min_landmark_quality: 0.01

output_params:
  debug: 0
  output_dir: ~/svin_ws/src/SVIn/pose_graph
